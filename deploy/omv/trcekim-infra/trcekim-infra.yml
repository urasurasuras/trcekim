# Shared services for the TRÇekim sites: the deployer and a local SMTP catcher.
# OMV stack "trcekim-infra" (Services → Compose → Files), with Dockerfile and deploy.sh
# in the OMV Dockerfile entry of the same name. See ../README.md.
name: trcekim-infra

services:
  # Local SMTP server that catches every e-mail the sites send. Nothing is relayed.
  mailpit:
    image: axllent/mailpit:v1.27.10
    container_name: trcekim-mailpit
    restart: unless-stopped
    user: "1000:100"
    environment:
      - TZ=Europe/Istanbul
      - MP_DATABASE=/data/mailpit.db
      - MP_MAX_MESSAGES=5000
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    volumes:
      - ${APPDATA:?}/trcekim-mailpit:/data
    ports:
      # Web UI, LAN only. SMTP (1025) is reachable only on the trcekim-mail network.
      - "8025:8025"
    networks:
      - mail

  # Polls GitHub and rebuilds a site when its branch moves (deploy.sh).
  deployer:
    build: .
    image: local/trcekim-deployer:latest
    container_name: trcekim-deployer
    restart: unless-stopped
    environment:
      - TZ=Europe/Istanbul
      - REPO_URL=${REPO_URL:?}
      - POLL_SECONDS=${POLL_SECONDS:-60}
      # "<compose project>:<branch>" pairs; each project reads <project>/<project>.env from here.
      - ENVIRONMENTS=${ENVIRONMENTS:-trcekim:main trcekim-dev:dev}
      - STATE_DIR=/state
      - CONFIG_DIR=/config
    volumes:
      # Full control of the host's Docker, as needed to build and start the sites.
      - /var/run/docker.sock:/var/run/docker.sock
      # Checkouts, deploy state and the read-only GitHub deploy key (ssh/).
      - ${APPDATA:?}/trcekim-deployer:/state
      # The OMV compose folder, for the sites' env files.
      - ${COMPOSE_DIR:-/docker/docker-compose}:/config:ro

networks:
  # Shared with the sites. Created once with: docker network create trcekim-mail
  mail:
    name: trcekim-mail
    external: true
